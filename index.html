<div class="phone" id="app">
  <main id="vista"></main>

  <nav class="tabs" aria-label="Secciones">
    <button class="tab" data-tab="inicio"><svg><use href="#i-home"/></svg><span>Inicio</span></button>
    <button class="tab" data-tab="comidas"><svg><use href="#i-food"/></svg><span>Comidas</span></button>
    <button class="tab" data-tab="paseos"><svg><use href="#i-paw"/></svg><span>Paseos</span></button>
    <button class="tab" data-tab="historial"><svg><use href="#i-cal"/></svg><span>Historial</span></button>
    <button class="tab" data-tab="karim"><svg><use href="#i-paw"/></svg><span>Karim</span></button>
  </nav>

  <!-- Pantallas que se abren encima (registrar, editar, configuración) -->
  <section class="pantalla" id="pantalla" hidden aria-modal="true" role="dialog" aria-labelledby="pantallaTitulo">
    <header class="barra">
      <button class="barra-btn" data-cerrar aria-label="Volver"><svg><use href="#i-back"/></svg></button>
      <h1 id="pantallaTitulo" class="barra-titulo"></h1>
      <span class="barra-btn" aria-hidden="true"></span>
    </header>
    <div class="pantalla-cuerpo" id="pantallaCuerpo"></div>
  </section>

  <!-- Menú lateral -->
  <div class="menu" id="menu" hidden>
    <div class="menu-fondo" data-menu-cerrar></div>
    <aside class="menu-panel" aria-label="Menú">
      <img src="img/logo.png" alt="Karim Daily — Cada día, con Karim" class="menu-logo">
      <button class="menu-item" data-ir="inicio"><svg><use href="#i-home"/></svg>Inicio</button>
      <button class="menu-item" data-ir="comidas"><svg><use href="#i-food"/></svg>Comidas</button>
      <button class="menu-item" data-ir="paseos"><svg><use href="#i-paw"/></svg>Paseos</button>
      <button class="menu-item" data-ir="historial"><svg><use href="#i-cal"/></svg>Historial</button>
      <button class="menu-item" data-ir="karim"><svg><use href="#i-paw"/></svg>Karim</button>
      <hr>
      <button class="menu-item" data-recargar><svg><use href="#i-sync"/></svg>Actualizar datos</button>
      <button class="menu-item" data-config><svg><use href="#i-gear"/></svg>Configuración</button>
    </aside>
  </div>

  <div class="aviso" id="aviso" hidden role="status"></div>
</div>
